function getActivities(){
  var raw=localStorage.getItem("cia500_activities");
  return raw?JSON.parse(raw):DEFAULT_ACTIVITIES;
}
function getProducts(){
  var raw=localStorage.getItem("cia500_products");
  return raw?JSON.parse(raw):DEFAULT_PRODUCTS;
}
function getRates(){
  var raw=localStorage.getItem("cia500_rates");
  return raw?JSON.parse(raw):DEFAULT_RATES;
}

function calcComm(pdt,premium,tenure){
  var rates=getRates();
  var r=rates[pdt.toUpperCase()]||rates[pdt];
  if(!r)return{comm:0,gst:false,rate:0};
  var gst=r.gst?0.09:0;
  var base=premium/(1+gst);
  var rate=0;
  if(r.flat!==undefined){rate=r.flat;}
  else if(r.table){
    var t=parseInt(tenure);
    if(r.table[t]!==undefined){rate=r.table[t];}
    else{
      // find closest tenure
      var keys=Object.keys(r.table).map(Number).sort(function(a,b){return a-b;});
      var closest=keys.reduce(function(prev,cur){return Math.abs(cur-t)<Math.abs(prev-t)?cur:prev;});
      rate=r.table[closest];
    }
  }
  var comm=Math.round(base*(rate/100)*100)/100;
  return{comm:comm,gst:gst>0,rate:rate};
}

// ── API ──────────────────────────────────────────────────────────────────────
function api(method,table,body,params){
  var url=SUPA_URL+"/rest/v1/"+table+(params?"?"+params:"");
  return fetch(url,{
    method:method||"GET",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":method==="POST"?"return=representation":""},
    body:body?JSON.stringify(body):undefined
  }).then(function(r){return r.json();});
}

function pad(n){return n<10?"0"+n:""+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString("en-SG",{day:"numeric",month:"short"});}
function fmtMoney(n){return"$"+Number(n||0).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

    (rows||[]).filter(function(a){return a.active!==false;}).forEach(function(a){

    });

    if(saved){try{curAssociate=JSON.parse(saved);showApp();}catch(e){}}
  });
}
function doLogin(){
  var sel=document.getElementById("sel-associate");
  var id=sel.value,name=sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].text;
  if(!id){document.getElementById("sel-err").textContent="Please select your name.";return;}
  curAssociate={id:id,name:name};
  localStorage.setItem("cia500_user",JSON.stringify(curAssociate));
  showApp();
}
function doLogout(){
  curAssociate=null;localStorage.removeItem("cia500_user");
  document.getElementById("app").style.display="none";

function showApp(){

function switchTab(t){

    var match=(el.textContent.toLowerCase()===t)||(t==="mydata"&&el.textContent==="My Data");
    el.classList.toggle("active",match);
  });
  render();
}
function render(){

  else if(curTab==="sales")renderSales();
  else if(curTab==="dashboard")renderDashboard();
  else if(curTab==="mydata")renderMyData();
  else renderAdmin();
}

// ── LOG ACTIVITY ──────────────────────────────────────────────────────────────
function renderLog(){
  var acts=getActivities();
  var html='<div class="card"><div class="card-head"><div class="card-title">Log Activity</div><div class="card-sub">'+todayStr()+'</div></div>';
  html+='<div class="form-group"><div class="form-label">Activity</div><select class="form-select" id="act-type">';
  acts.forEach(function(a){html+='<option value="'+esc(a.type)+'|'+a.pts+'">'+esc(a.type)+' ('+a.pts+' pts)</option>';});
  html+='</select></div>';
  html+='<div class="form-group"><div class="form-label">Date</div><input type="date" class="form-input" id="act-date" value="'+todayStr()+'"/></div>';
  html+='</div><button class="submit-btn" onclick="submitActivity()">Log Activity</button>';
  html+='<div id="act-msg"></div>';
  html+='<div class="section-label">Today\'s Log</div>';
  html+='<div class="card" id="act-list"><div class="loading">Loading…</div></div>';
  document.getElementById("content").innerHTML=html;
  loadTodayActivities();
}
function loadTodayActivities(){
  api("GET","activities","","select=*&associate_id=eq."+curAssociate.id+"&activity_date=eq."+todayStr()+"&order=created_at.desc").then(function(rows){
    var el=document.getElementById("act-list");if(!el)return;
    if(!rows||!rows.length){el.innerHTML='<div class="empty">No activities logged today.</div>';return;}
    var total=rows.reduce(function(a,r){return a+(r.points||0);},0);
    var html='<div class="list-row"><span class="list-name" style="color:#555">Total today</span><span class="list-val">'+total+' pts</span></div>';
    rows.forEach(function(r){
      html+='<div class="act-row"><div style="flex:1"><div class="act-type">'+esc(r.activity_type)+'</div><div class="act-date">'+fmtDate(r.activity_date)+'</div></div>'
        +'<span class="act-pts">'+r.points+' pts</span>'
        +'<button class="del-btn" onclick="delActivity(\''+r.id+'\')">×</button></div>';
    });
    el.innerHTML=html;
  });
}
function submitActivity(){
  var val=document.getElementById("act-type").value.split("|");
  var date=document.getElementById("act-date").value||todayStr();
  var msg=document.getElementById("act-msg");
  api("POST","activities",{associate_id:curAssociate.id,activity_type:val[0],points:parseInt(val[1]),activity_date:date}).then(function(r){
    if(r&&r[0]&&r[0].id){
      msg.innerHTML='<div class="msg">✓ Logged: '+esc(val[0])+'</div>';
      loadTodayActivities();setTimeout(function(){msg.innerHTML="";},2000);
    }else{msg.innerHTML='<div class="msg err">Error. Try again.</div>';}
  });
}

function updatePdtList(){
  var cat=document.getElementById("pdt-cat").value;
  var products=getProducts();
  var pdts=products[cat]||[];
  var sel=document.getElementById("pdt-name");
  sel.innerHTML="";
  pdts.forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;sel.appendChild(o);});
  previewComm();
}
function previewComm(){
  var pdt=document.getElementById("pdt-name")?document.getElementById("pdt-name").value:"";
  var premium=parseFloat(document.getElementById("pdt-premium")?document.getElementById("pdt-premium").value:0)||0;
  var tenure=parseInt(document.getElementById("pdt-tenure")?document.getElementById("pdt-tenure").value:1)||1;
  var res=calcComm(pdt,premium,tenure);
  var el=document.getElementById("comm-preview");
  if(el){el.querySelector(".comm-amount").textContent=fmtMoney(res.comm);}
  var note=document.getElementById("comm-note");
  if(note)note.textContent=res.rate?"Rate: "+res.rate+"% (Year 1)"+(res.gst?" · GST 9% included":""):"Rate unknown — check admin";
  var gstNote=document.getElementById("gst-note");
  if(gstNote)gstNote.style.display=res.gst?"block":"none";
  // Show/hide tenure for flat rate products
  var rates=getRates();
  var r=rates[pdt];
  var tenureGroup=document.getElementById("tenure-group");
  if(tenureGroup)tenureGroup.style.display=(r&&r.flat!==undefined)?"none":"block";
}
function submitSale(){
  var pdt=document.getElementById("pdt-name").value;
  var pdtType=document.getElementById("pdt-cat").value;
  var premium=parseFloat(document.getElementById("pdt-premium").value)||0;
  var tenure=parseInt(document.getElementById("pdt-tenure").value)||1;
  var date=document.getElementById("pdt-date").value||todayStr();
  var msg=document.getElementById("sale-msg");
  if(!premium){msg.innerHTML='<div class="msg err">Enter a premium amount.</div>';return;}
  var res=calcComm(pdt,premium,tenure);
  api("POST","sales",{associate_id:curAssociate.id,pdt_type:pdtType,pdt:pdt,premium:premium,tenure:tenure,gst:res.gst?0.09:0,commission:res.comm,sale_date:date}).then(function(r){
    if(r&&r[0]&&r[0].id){
      msg.innerHTML='<div class="msg">✓ Sale logged — FYC: '+fmtMoney(res.comm)+'</div>';
      loadMySales();setTimeout(function(){msg.innerHTML="";},2500);
      document.getElementById("pdt-premium").value="";
      previewComm();
    }else{msg.innerHTML='<div class="msg err">Error. Try again.</div>';}
  });
}

  api("GET","sales","","select=*&associate_id=eq."+curAssociate.id+"&order=sale_date.desc&limit=20").then(function(rows){

function delSale(id){

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  document.getElementById("content").innerHTML='<div class="loading">Loading dashboard…</div>';
  Promise.all([
    api("GET","associates","","select=id,name,target&order=name.asc&active=not.eq.false"),
    api("GET","sales","","select=associate_id,commission"),
    api("GET","activities","","select=associate_id,points,activity_date")
  ]).then(function(res){
    var assocs=res[0]||[],sales=res[1]||[],acts=res[2]||[];
    var today=todayStr();
    var fyc={},pts={},ptsTdy={};
    assocs.forEach(function(a){fyc[a.id]=0;pts[a.id]=0;ptsTdy[a.id]=0;});
    sales.forEach(function(s){fyc[s.associate_id]=(fyc[s.associate_id]||0)+(s.commission||0);});
    acts.forEach(function(a){
      pts[a.associate_id]=(pts[a.associate_id]||0)+(a.points||0);
      if(a.activity_date===today)ptsTdy[a.associate_id]=(ptsTdy[a.associate_id]||0)+(a.points||0);
    });
    var sorted=assocs.slice().sort(function(a,b){return(fyc[b.id]||0)-(fyc[a.id]||0);});
    var maxFyc=Math.max.apply(null,sorted.map(function(a){return fyc[a.id]||0;})||[1]);
    if(maxFyc===0)maxFyc=1;
    var totalFyc=sales.reduce(function(a,s){return a+(s.commission||0);},0);
    var totalPts=Object.values(pts).reduce(function(a,b){return a+b;},0);
    var todayPts=Object.values(ptsTdy).reduce(function(a,b){return a+b;},0);

    var html='<div class="stat-grid">'
      +'<div class="stat-box"><div class="stat-label">Team FYC</div><div class="stat-val gold">'+fmtMoney(totalFyc)+'</div></div>'
      +'<div class="stat-box"><div class="stat-label">Total Pts</div><div class="stat-val">'+totalPts+'</div></div>'
      +'<div class="stat-box"><div class="stat-label">Today Pts</div><div class="stat-val">'+todayPts+'</div></div>'
      +'</div>';

    html+='<div class="section-label">FYC — Year to Date</div><div class="card"><div class="chart-wrap">';
    sorted.forEach(function(a){
      var pct=Math.round((fyc[a.id]||0)/maxFyc*100);
      var goalPct=a.target>0?Math.min(100,Math.round((fyc[a.id]||0)/a.target*100)):0;
      html+='<div class="chart-bar-row"><div class="chart-name">'+esc(a.name)+'</div>'
        +'<div class="chart-bar-bg"><div class="chart-bar-inner" style="width:'+pct+'%">'+fmtMoney(fyc[a.id]||0)+'</div></div></div>';
      html+='<div style="display:flex;align-items:center;gap:8px;padding:0 0 4px 70px">'
        +'<div class="bar-wrap" style="flex:1;margin:0"><div class="bar-fill" style="width:'+goalPct+'%;background:#2a4a1a"></div></div>'
        +'<span style="font-size:9px;color:#444;min-width:38px">'+goalPct+'% of target</span></div>';
    });
    html+='</div></div>';

    html+='<div class="section-label">Points Leaderboard</div><div class="card">';
    var ptsSorted=assocs.slice().sort(function(a,b){return(pts[b.id]||0)-(pts[a.id]||0);});
    ptsSorted.forEach(function(a,i){
      html+='<div class="list-row"><div class="rank">'+(i+1)+'</div>'
        +'<div class="list-name">'+esc(a.name)+'</div>'
        +'<div><div class="list-val">'+(pts[a.id]||0)+' pts</div>'
        +'<div class="list-sub">Today: '+(ptsTdy[a.id]||0)+'</div></div></div>';
    });
    // Nudge section
    html+='<div class="section-label">Today\'s Nudge Status</div><div class="card">';
    var nudges=getNudges();
    var today2=todayStr();
    assocs.forEach(function(a){
      var hasLogged=ptsTdy[a.id]>0;
      var nudge=nudges[today2]&&nudges[today2][a.id];
      var status,btnHtml="";
      if(hasLogged){
        status='<span style="font-size:11px;color:#4caf50;font-weight:600">✓ Logged</span>';
      } else if(nudge){
        status='<span style="font-size:11px;color:#f5a623">⚠ Nudged by '+esc(nudge.by)+' at '+nudge.time+'</span>';
        btnHtml='<button onclick="sendNudge(''+a.id+'',''+esc(a.name)+'',''+esc(a.phone||"")+'',true)" style="padding:4px 8px;border:1px solid #333;border-radius:6px;background:transparent;color:#555;font-size:10px;cursor:pointer">Nudge again</button>';
      } else {
        status='<span style="font-size:11px;color:#e74c3c">✗ Not logged</span>';
        if(a.id!==curAssociate.id){
          btnHtml='<button onclick="sendNudge(''+a.id+'',''+esc(a.name)+'',''+esc(a.phone||"")+'',false)" style="padding:4px 10px;border:1px solid #f5a623;border-radius:6px;background:transparent;color:#f5a623;font-size:10px;cursor:pointer;font-weight:600">Nudge 💬</button>';
        }
      }
      html+='<div class="list-row"><div class="list-name">'+esc(a.name)+'</div>'
        +'<div style="display:flex;align-items:center;gap:8px">'+status+btnHtml+'</div></div>';
    });
    html+='</div><div style="height:20px"></div>';

    document.getElementById("content").innerHTML=html;
  });
}

function getNudges(){
  var raw=localStorage.getItem("cia500_nudges");
  return raw?JSON.parse(raw):{};
}

function saveNudge(associateId,byName){
  var nudges=getNudges();
  var today=todayStr();
  if(!nudges[today])nudges[today]={};
  var now=new Date();
  var time=now.getHours()+":"+pad(now.getMinutes());
  nudges[today][associateId]={by:byName,time:time};
  // Clean up old dates (keep last 7 days only)
  Object.keys(nudges).forEach(function(d){
    if(d<addDays(today,-7))delete nudges[d];
  });
  localStorage.setItem("cia500_nudges",JSON.stringify(nudges));
}

function sendNudge(id,name,phone,alreadyNudged){
  if(alreadyNudged){
    if(!confirm(name+" was already nudged today. Send again?"))return;
  }
  var msg="Hi "+name+", just a reminder to log your activities for today on CIA500! 💪";
  var encoded=encodeURIComponent(msg);
  var url;
  if(phone){
    // Clean phone — remove spaces, dashes, +
    var cleanPhone=phone.replace(/[\s\-\+]/g,"");
    url="https://wa.me/"+cleanPhone+"?text="+encoded;
  } else {
    // No phone saved — open WhatsApp without number
    url="https://wa.me/?text="+encoded;
    alert("No WhatsApp number saved for "+name+". Go to Admin → Associates to add their number. Opening WhatsApp — you can paste or search manually.");
  }
  saveNudge(id,curAssociate.name);
  window.open(url,"_blank");
  // Re-render to show nudged status
  setTimeout(function(){renderDashboard();},500);
}

function loadAdminAssociates(){

function updateAssociate(el){
  var id=el.dataset.aid,field=el.dataset.field;
  var val=field==="target"?parseFloat(el.value)||0:el.value;
  var body={};body[field]=val;
  fetch(SUPA_URL+"/rest/v1/associates?id=eq."+id,{
    method:"PATCH",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify(body)
  }).then(function(){showAssocMsg("✓ Updated");});
}

function addAssociate(){
  var name=(document.getElementById("new-assoc-name").value||"").trim();
  var target=parseFloat(document.getElementById("new-assoc-target").value)||0;
  var phone=(document.getElementById("new-assoc-phone").value||"").trim();
  var msg=document.getElementById("assoc-msg");
  if(!name){msg.innerHTML='<div class="msg err">Enter a name.</div>';return;}
  // Generate next ID
  api("GET","associates","","select=id&order=id.desc&limit=1").then(function(rows){
    var lastId=(rows&&rows[0]&&rows[0].id)||"ID000";
    var num=parseInt(lastId.replace("ID",""))+1;
    var newId="ID"+String(num).padStart(3,"0");
    api("POST","associates",{id:newId,name:name,target:target,phone:phone||null}).then(function(r){
      if(r&&r[0]&&r[0].id){
        msg.innerHTML='<div class="msg">✓ '+esc(name)+' added as '+newId+'</div>';
        document.getElementById("new-assoc-name").value="";
        document.getElementById("new-assoc-target").value="";
        document.getElementById("new-assoc-phone").value="";
        loadAdminAssociates();
        setTimeout(function(){msg.innerHTML="";},2500);
      }else{msg.innerHTML='<div class="msg err">Error adding. Try again.</div>';}
    });
  });
}

function delAssociate(id,name){
  if(!confirm("Deactivate "+name+"? They will be hidden from the app but their historical data is preserved."))return;
  fetch(SUPA_URL+"/rest/v1/associates?id=eq."+id,{
    method:"PATCH",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify({active:false})
  }).then(function(){loadAdminAssociates();showAssocMsg("✓ "+name+" deactivated");});

function reactivateAssociate(id,name){

    method:"PATCH",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},

  var acts=getActivities();
  acts.forEach(function(a,i){
    html+='<div class="admin-row"><span class="admin-tag" style="min-width:120px;font-size:11px;color:#888">'+esc(a.type)+'</span>'
      +'<input type="number" value="'+a.pts+'" data-ai="'+i+'" onchange="updateActPts(this)" style="max-width:70px"/><span style="font-size:10px;color:#444">pts</span></div>';
  });
  html+='</div>';

  // Commission rates
  html+='<div class="section-label">Commission Rates (Year 1 %)</div><div class="card">';
  var rates=getRates();
  Object.keys(rates).sort().forEach(function(pdt){
    var r=rates[pdt];
    if(r.flat!==undefined){
      html+='<div class="admin-row"><span class="admin-tag" style="min-width:130px;font-size:11px;color:#888">'+esc(pdt)+'</span>'
        +'<input type="number" step="0.01" value="'+r.flat+'" data-pdt="'+esc(pdt)+'" data-type="flat" onchange="updateRate(this)" style="max-width:70px"/><span style="font-size:10px;color:#444">%'+(r.gst?' · GST':'')+'</span></div>';
    } else if(r.table){
      html+='<div style="padding:6px 12px 2px;border-bottom:1px solid #1a1a1a"><span style="font-size:10px;color:#666">'+esc(pdt)+' (tenure-based)</span></div>';
      Object.keys(r.table).sort(function(a,b){return a-b;}).forEach(function(tenure){
        html+='<div class="admin-row" style="padding:4px 12px"><span style="font-size:10px;color:#555;min-width:60px">'+tenure+'yr</span>'
          +'<input type="number" step="0.01" value="'+r.table[tenure]+'" data-pdt="'+esc(pdt)+'" data-tenure="'+tenure+'" data-type="table" onchange="updateRate(this)" style="max-width:70px"/><span style="font-size:10px;color:#444">%</span></div>';
      });
    }
  });
  html+='</div>';

  html+='<button class="submit-btn sec" onclick="addProduct()">+ Add product/rate</button>';
  html+='<button class="submit-btn red" onclick="resetDefaults()">Reset all to defaults</button>';
  html+='<div id="admin-msg"></div><div style="height:30px"></div>';
  document.getElementById("content").innerHTML=html;
  loadAdminAssociates();
}

function updateActPts(el){
  var acts=getActivities();
  acts[parseInt(el.dataset.ai)].pts=parseInt(el.value)||0;
  localStorage.setItem("cia500_activities",JSON.stringify(acts));
  showAdminMsg("✓ Saved");
}
function updateRate(el){
  var rates=getRates();
  var pdt=el.dataset.pdt;
  if(!rates[pdt])rates[pdt]={};
  if(el.dataset.type==="flat"){rates[pdt].flat=parseFloat(el.value)||0;}
  else if(el.dataset.type==="table"){
    if(!rates[pdt].table)rates[pdt].table={};
    rates[pdt].table[el.dataset.tenure]=parseFloat(el.value)||0;
  }
  localStorage.setItem("cia500_rates",JSON.stringify(rates));
  showAdminMsg("✓ Saved");
}
function addProduct(){
  var pdt=prompt("Enter product code (e.g. NEWPDT):");
  if(!pdt)return;
  var rate=prompt("Enter Year 1 commission rate % (e.g. 30):");
  if(!rate)return;
  var gstStr=prompt("Does this product have 9% GST embedded? (yes/no):","no");
  var rates=getRates();
  rates[pdt.toUpperCase()]={flat:parseFloat(rate)||0,gst:gstStr&&gstStr.toLowerCase()==="yes"};
  localStorage.setItem("cia500_rates",JSON.stringify(rates));
  // Add to products list — prompt for category
  var products=getProducts();
  var cats=Object.keys(products).join(", ");
  var cat=prompt("Add to which category? ("+cats+"):");
  if(cat&&products[cat]){
    products[cat].push(pdt.toUpperCase());
    localStorage.setItem("cia500_products",JSON.stringify(products));
  }
  showAdminMsg("✓ "+pdt.toUpperCase()+" added");
  renderAdmin();
}
function resetDefaults(){
  if(!confirm("Reset ALL custom changes to defaults? This cannot be undone."))return;
  localStorage.removeItem("cia500_activities");
  localStorage.removeItem("cia500_products");
  localStorage.removeItem("cia500_rates");
  showAdminMsg("✓ Reset to defaults");
  renderAdmin();
}
function showAdminMsg(txt){
  var el=document.getElementById("admin-msg");
  if(el){el.innerHTML='<div class="msg">'+txt+'</div>';setTimeout(function(){if(el)el.innerHTML="";},1500);}
}

var ADMIN_UNLOCKED=false;
function unlockAdmin(){
  if(ADMIN_UNLOCKED){
    // lock it again
    ADMIN_UNLOCKED=false;
    document.getElementById("admin-tab").style.display="none";
    document.getElementById("admin-lock").textContent="🔒";
    if(curTab==="admin"){switchTab("log");}
    return;
  }
  var pin=prompt("Enter admin PIN:");
  if(!pin)return;
  if(pin==="44931"){
    ADMIN_UNLOCKED=true;
    document.getElementById("admin-tab").style.display="";
    document.getElementById("admin-lock").textContent="🔓";
  } else {
    alert("Incorrect PIN.");
  }
}

loadAssociates();
</script>
</body>
</html>

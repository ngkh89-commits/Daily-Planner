function getActs(){var r=localStorage.getItem("c5_acts");return r?JSON.parse(r):ACTS_DEFAULT;}
function getProds(){var r=localStorage.getItem("c5_prods");return r?JSON.parse(r):PRODS_DEFAULT;}
function getRates(){var r=localStorage.getItem("c5_rates");return r?JSON.parse(r):RATES_DEFAULT;}
function getNudges(){var r=localStorage.getItem("c5_nudges");return r?JSON.parse(r):{};}
function saveNudge(aid,byName){
  var n=getNudges(),t=todayStr();
  if(!n[t])n[t]={};
  var now=new Date();
  n[t][aid]={by:byName,time:now.getHours()+":"+pad(now.getMinutes())};
  Object.keys(n).forEach(function(d){if(d<addDays(t,-7))delete n[d];});
  localStorage.setItem("c5_nudges",JSON.stringify(n));
}

function calcComm(pdt,premium,tenure){
  var rates=getRates(),r=rates[pdt]||rates[pdt.toUpperCase()];
  if(!r)return{comm:0,gst:false,rate:0};
  var gst=r.gst?0.09:0,base=premium/(1+gst),rate=0;
  if(r.flat!==undefined){rate=r.flat;}
  else if(r.table){
    var t=parseInt(tenure);
    if(r.table[t]!==undefined){rate=r.table[t];}
    else{
      var keys=Object.keys(r.table).map(Number).sort(function(a,b){return Math.abs(a-t)-Math.abs(b-t);});
      rate=r.table[keys[0]]||0;
    }
  }
  return{comm:Math.round(base*(rate/100)*100)/100,gst:gst>0,rate:rate};
}

function api(m,tbl,body,params){
  var url=SB+"/rest/v1/"+tbl+(params?"?"+params:"");
  return fetch(url,{method:m||"GET",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":m==="POST"?"return=representation":""},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json();});
}
function del(tbl,q){return fetch(SB+"/rest/v1/"+tbl+"?"+q,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}});}
function patch(tbl,q,body){return fetch(SB+"/rest/v1/"+tbl+"?"+q,{method:"PATCH",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(body)});}

function pad(n){return n<10?"0"+n:""+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(d,n){var p=d.split("-");var dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()+n);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}
function fmtD(d){return new Date(d+"T00:00:00").toLocaleDateString("en-SG",{day:"numeric",month:"short"});}
function fmtM(n){return"$"+Number(n||0).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function chk(){return'<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3L3.5 5.5L8 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

var curUser=null,curTab="log";

function loadAssociates(){
  api("GET","associates","","order=name.asc&select=id,name,active").then(function(rows){
    var sel=document.getElementById("sel-name");
    (rows||[]).filter(function(a){return a.active!==false;}).forEach(function(a){
      var o=document.createElement("option");o.value=a.id;o.textContent=a.name;sel.appendChild(o);
    });
    var saved=localStorage.getItem("c5_user");
    if(saved){try{curUser=JSON.parse(saved);showApp();}catch(e){}}
  });
}

function doLogin(){
  var sel=document.getElementById("sel-name");
  var id=sel.value,name=sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].text;
  if(!id){document.getElementById("sel-err").textContent="Please select your name.";return;}
  curUser={id:id,name:name};
  localStorage.setItem("c5_user",JSON.stringify(curUser));
  showApp();
}
function doLogout(){curUser=null;localStorage.removeItem("c5_user");document.getElementById("app").style.display="none";document.getElementById("splash").style.display="flex";}
function showApp(){document.getElementById("splash").style.display="none";document.getElementById("app").style.display="block";document.getElementById("whoami").textContent=curUser.name;go("log");}

function toggleAdmin(){
  if(adminUnlocked){adminUnlocked=false;document.getElementById("admin-tab").style.display="none";document.getElementById("lockbtn").textContent="\u{1F512}";if(curTab==="admin")go("log");return;}
  var pin=prompt("Enter admin PIN:");
  if(!pin)return;
  if(pin===ADMIN_PIN){adminUnlocked=true;document.getElementById("admin-tab").style.display="";document.getElementById("lockbtn").textContent="\u{1F513}";}
  else alert("Incorrect PIN.");
}

function go(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(el){el.classList.toggle("active",el.textContent.toLowerCase()===t||(t==="mine"&&el.textContent==="My Data")||(t==="dash"&&el.textContent==="Dashboard")||(t==="admin"&&el.textContent==="Admin"));});
  render();
}
function render(){
  if(curTab==="log")renderLog();
  else if(curTab==="sales")renderSales();
  else if(curTab==="dash")renderDash();
  else if(curTab==="mine")renderMine();
  else renderAdmin();
}

// LOG
function renderLog(){
  var acts=getActs();
  var h='<div class="card"><div class="card-head"><div class="card-title">Log Activity</div><div class="card-sub">'+todayStr()+'</div></div>';
  h+='<div class="fg"><div class="fl">Activity</div><select class="fs" id="act-sel">';
  acts.forEach(function(a){h+='<option value="'+esc(a.type)+'|'+a.pts+'">'+esc(a.type)+' ('+a.pts+' pts)</option>';});
  h+='</select></div><div class="fg"><div class="fl">Date</div><input type="date" class="fi" id="act-date" value="'+todayStr()+'"/></div></div>';
  h+='<button class="btn" onclick="submitAct()">Log Activity</button><div id="act-msg"></div>';
  h+='<div class="sec-lbl">Today</div><div class="card" id="act-list"><div class="ld">Loading...</div></div>';
  document.getElementById("content").innerHTML=h;
  loadTodayActs();
}
function loadTodayActs(){
  api("GET","activities","","select=*&associate_id=eq."+curUser.id+"&activity_date=eq."+todayStr()+"&order=created_at.desc").then(function(rows){
    var el=document.getElementById("act-list");if(!el)return;
    if(!rows||!rows.length){el.innerHTML='<div class="emp">Nothing logged today.</div>';return;}
    var total=rows.reduce(function(a,r){return a+(r.points||0);},0);
    var h='<div class="lr"><span class="ln" style="color:#999">Total today</span><span class="lv">'+total+' pts</span></div>';
    rows.forEach(function(r){
      h+='<div class="ar"><div style="flex:1"><div class="at">'+esc(r.activity_type)+'</div><div class="ad">'+fmtD(r.activity_date)+'</div></div>'
        +'<span class="ap">'+r.points+' pts</span>'
        +'<button class="db" onclick="delAct(\''+r.id+'\')">x</button></div>';
    });
    el.innerHTML=h;
  });
}
function submitAct(){
  var v=document.getElementById("act-sel").value.split("|");
  var date=document.getElementById("act-date").value||todayStr();
  var msg=document.getElementById("act-msg");
  api("POST","activities",{associate_id:curUser.id,activity_type:v[0],points:parseInt(v[1]),activity_date:date}).then(function(r){
    if(r&&r[0]&&r[0].id){msg.innerHTML='<div class="ms">Logged: '+esc(v[0])+'</div>';loadTodayActs();setTimeout(function(){msg.innerHTML="";},2000);}
    else msg.innerHTML='<div class="ms er">Error. Try again.</div>';
  });
}
function delAct(id){if(!confirm("Delete?"))return;del("activities","id=eq."+id).then(function(){loadTodayActs();});}

  cats.forEach(function(c){h+='<option>'+c+'</option>';});
  h+='</select></div><div class="fg"><div class="fl">Product</div><select class="fs" id="pdt-name" onchange="prevComm()"></select></div>';
  h+='<div id="gst-note" class="gn" style="display:none">This product has 9% GST in the premium</div>';
  h+='<div class="fg"><div class="fl">Premium ($)</div><input type="number" class="fi" id="pdt-prem" placeholder="0.00" oninput="prevComm()"/></div>';
  h+='<div class="fg" id="tenure-grp"><div class="fl">Tenure (years)</div><input type="number" class="fi" id="pdt-ten" value="25" oninput="prevComm()"/></div>';
  h+='<div class="fg"><div class="fl">Sale Date</div><input type="date" class="fi" id="pdt-date" value="'+todayStr()+'"/></div></div>';
  h+='<div class="cr"><div class="ca" id="comm-amt">$0.00</div><div class="cn">Estimated FYC</div><div class="cn2" id="comm-note"></div></div>';
  h+='<button class="btn" onclick="submitSale()">Log Sale</button><div id="sale-msg"></div>';
  h+='<div class="sec-lbl">My Recent Sales</div><div class="card" id="sale-list"><div class="ld">Loading...</div></div>';
  document.getElementById("content").innerHTML=h;
  updatePdts();loadMySales();
}
function updatePdts(){
  var cat=document.getElementById("pdt-cat").value,prods=getProds(),pdts=prods[cat]||[];
  var sel=document.getElementById("pdt-name");sel.innerHTML="";
  pdts.forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;sel.appendChild(o);});
  prevComm();
}
function prevComm(){
  var pdt=document.getElementById("pdt-name")?document.getElementById("pdt-name").value:"";
  var prem=parseFloat(document.getElementById("pdt-prem")?document.getElementById("pdt-prem").value:0)||0;
  var ten=parseInt(document.getElementById("pdt-ten")?document.getElementById("pdt-ten").value:1)||1;
  var res=calcComm(pdt,prem,ten);
  var el=document.getElementById("comm-amt");if(el)el.textContent=fmtM(res.comm);
  var n=document.getElementById("comm-note");if(n)n.textContent=res.rate?"Rate: "+res.rate+"% Y1"+(res.gst?" + 9% GST":""):"";
  var gn=document.getElementById("gst-note");if(gn)gn.style.display=res.gst?"block":"none";
  var tg=document.getElementById("tenure-grp");
  var rates=getRates(),r=rates[pdt];
  if(tg)tg.style.display=(r&&r.flat!==undefined)?"none":"block";
}
function submitSale(){
  var pdt=document.getElementById("pdt-name").value;
  var cat=document.getElementById("pdt-cat").value;
  var prem=parseFloat(document.getElementById("pdt-prem").value)||0;
  var ten=parseInt(document.getElementById("pdt-ten").value)||1;
  var date=document.getElementById("pdt-date").value||todayStr();
  var msg=document.getElementById("sale-msg");
  if(!prem){msg.innerHTML='<div class="ms er">Enter premium amount.</div>';return;}
  var res=calcComm(pdt,prem,ten);
  api("POST","sales",{associate_id:curUser.id,pdt_type:cat,pdt:pdt,premium:prem,tenure:ten,gst:res.gst?0.09:0,commission:res.comm,sale_date:date}).then(function(r){
    if(r&&r[0]&&r[0].id){
      msg.innerHTML='<div class="ms">Sale logged - FYC: '+fmtM(res.comm)+'</div>';
      loadMySales();document.getElementById("pdt-prem").value="";prevComm();
      setTimeout(function(){msg.innerHTML="";},2500);
    }else msg.innerHTML='<div class="ms er">Error. Try again.</div>';
  });
}
function loadMySales(){
  api("GET","sales","","select=*&associate_id=eq."+curUser.id+"&order=sale_date.desc&limit=20").then(function(rows){
    var el=document.getElementById("sale-list");if(!el)return;
    if(!rows||!rows.length){el.innerHTML='<div class="emp">No sales yet.</div>';return;}
    var total=rows.reduce(function(a,r){return a+(r.commission||0);},0);
    var h='<div class="lr"><span class="ln" style="color:#999">Total FYC</span><span class="lv">'+fmtM(total)+'</span></div>';
    rows.forEach(function(r){
      h+='<div class="ar"><div style="flex:1"><div class="at">'+esc(r.pdt)+' - '+esc(r.pdt_type)+'</div>'
        +'<div class="ad">'+fmtM(r.premium)+' - '+r.tenure+'yr - '+fmtD(r.sale_date)+'</div></div>'
        +'<span class="ap">'+fmtM(r.commission)+'</span>'
        +'<button class="db" onclick="delSale(\''+r.id+'\')">x</button></div>';
    });
    el.innerHTML=h;
  });
}
function delSale(id){if(!confirm("Delete?"))return;del("sales","id=eq."+id).then(function(){loadMySales();});}

// DASHBOARD
function renderDash(){
  document.getElementById("content").innerHTML='<div class="ld">Loading...</div>';
  Promise.all([
    api("GET","associates","","select=id,name,target,phone&order=name.asc"),
    api("GET","sales","","select=associate_id,commission"),
    api("GET","activities","","select=associate_id,points,activity_date")
  ]).then(function(res){
    var assocs=(res[0]||[]).filter(function(a){return a.active!==false;});
    var sales=res[1]||[],acts=res[2]||[],today=todayStr();
    var fyc={},pts={},ptd={};
    assocs.forEach(function(a){fyc[a.id]=0;pts[a.id]=0;ptd[a.id]=0;});
    sales.forEach(function(s){fyc[s.associate_id]=(fyc[s.associate_id]||0)+(s.commission||0);});
    acts.forEach(function(a){pts[a.associate_id]=(pts[a.associate_id]||0)+(a.points||0);if(a.activity_date===today)ptd[a.associate_id]=(ptd[a.associate_id]||0)+(a.points||0);});
    var sorted=assocs.slice().sort(function(a,b){return(fyc[b.id]||0)-(fyc[a.id]||0);});
    var maxF=Math.max.apply(null,sorted.map(function(a){return fyc[a.id]||0;}).concat([1]));
    var totF=sales.reduce(function(a,s){return a+(s.commission||0);},0);
    var totP=Object.values(pts).reduce(function(a,b){return a+b;},0);
    var todP=Object.values(ptd).reduce(function(a,b){return a+b;},0);

    var h='<div class="sg"><div class="sb"><div class="sl">Team FYC</div><div class="sv g">'+fmtM(totF)+'</div></div>'
      +'<div class="sb"><div class="sl">Total Pts</div><div class="sv">'+totP+'</div></div>'
      +'<div class="sb"><div class="sl">Today Pts</div><div class="sv">'+todP+'</div></div></div>';

    h+='<div class="sec-lbl">FYC - Year to Date</div><div class="card"><div class="cw">';
    sorted.forEach(function(a){
      var pct=Math.round((fyc[a.id]||0)/maxF*100);
      var gp=a.target>0?Math.min(100,Math.round((fyc[a.id]||0)/a.target*100)):0;
      h+='<div class="cbr"><div class="cnm">'+esc(a.name)+'</div>'
        +'<div class="cbb"><div class="cbi" style="width:'+pct+'%">'+fmtM(fyc[a.id]||0)+'</div></div></div>';
      h+='<div style="display:flex;align-items:center;gap:8px;padding:0 0 4px 70px">'
        +'<div class="bw" style="flex:1;margin:0"><div class="bf" style="width:'+gp+'%;background:#2a4a1a"></div></div>'
        +'<span style="font-size:15px;color:#888;min-width:38px">'+gp+'% goal</span></div>';
    });
    h+='</div></div>';

    h+='<div class="sec-lbl">Points Board</div><div class="card">';
    assocs.slice().sort(function(a,b){return(pts[b.id]||0)-(pts[a.id]||0);}).forEach(function(a,i){
      h+='<div class="lr"><div class="rk">'+(i+1)+'</div><div class="ln">'+esc(a.name)+'</div>'
        +'<div><div class="lv">'+(pts[a.id]||0)+' pts</div><div class="ls">Today: '+(ptd[a.id]||0)+'</div></div></div>';
    });
    h+='</div>';

    h+='<div class="sec-lbl">Nudge Status</div><div class="card" id="nudge-wrap"></div>';
    h+='<div style="height:20px"></div>';
    document.getElementById("content").innerHTML=h;
    buildNudgeList(assocs,ptd);
  });
}

function buildNudgeList(assocs,ptd){
  var el=document.getElementById("nudge-wrap");if(!el)return;
  var nudges=getNudges(),t=todayStr(),h="";
  assocs.forEach(function(a){
    var logged=ptd[a.id]>0;
    var nudge=nudges[t]&&nudges[t][a.id];
    var statHtml,btnHtml="";
    if(logged){
      statHtml='<span style="font-size:17px;color:#4caf50;font-weight:600">Logged</span>';
    } else if(nudge){
      statHtml='<span style="font-size:17px;color:#f5a623">Nudged '+nudge.time+'</span>';
      if(a.id!==curUser.id){
        btnHtml='<button data-aid="'+esc(a.id)+'" data-aname="'+esc(a.name)+'" data-aphone="'+esc(a.phone||"")+'" data-again="1" onclick="doNudge(this)" style="padding:4px 8px;border:1px solid #333;border-radius:6px;background:transparent;color:#999;font-size:16px;cursor:pointer">Again</button>';
      }
    } else {
      statHtml='<span style="font-size:17px;color:#e74c3c">Not logged</span>';
      if(a.id!==curUser.id){
        btnHtml='<button data-aid="'+esc(a.id)+'" data-aname="'+esc(a.name)+'" data-aphone="'+esc(a.phone||"")+'" data-again="0" onclick="doNudge(this)" style="padding:4px 10px;border:1px solid #f5a623;border-radius:6px;background:transparent;color:#f5a623;font-size:16px;cursor:pointer;font-weight:600">Nudge</button>';
      }
    }
    h+='<div class="lr"><div class="ln">'+esc(a.name)+'</div><div style="display:flex;align-items:center;gap:8px">'+statHtml+btnHtml+'</div></div>';
  });
  el.innerHTML=h||'<div class="emp">No associates.</div>';
}

function doNudge(btn){
  var id=btn.dataset.aid,name=btn.dataset.aname,phone=btn.dataset.aphone,again=btn.dataset.again==="1";
  if(again&&!confirm(name+" already nudged. Send again?"))return;
  var msg="Hi "+name+", just a reminder to log your activities for today on CIA500!";
  var url=phone?"https://wa.me/"+phone.replace(/[^0-9]/g,"")+"?text="+encodeURIComponent(msg):"https://wa.me/?text="+encodeURIComponent(msg);
  if(!phone)alert("No phone for "+name+". Add in Admin tab.");
  saveNudge(id,curUser.name);
  window.open(url,"_blank");
  setTimeout(function(){renderDash();},600);
}

// MY DATA
function renderMine(){
  document.getElementById("content").innerHTML='<div class="ld">Loading...</div>';
  Promise.all([
    api("GET","sales","","select=*&associate_id=eq."+curUser.id+"&order=sale_date.desc"),
    api("GET","activities","","select=*&associate_id=eq."+curUser.id+"&order=activity_date.desc&limit=100"),
    api("GET","associates","","select=*&id=eq."+curUser.id)
  ]).then(function(res){
    var sales=res[0]||[],acts=res[1]||[],me=(res[2]||[])[0]||{};
    var totF=sales.reduce(function(a,s){return a+(s.commission||0);},0);
    var totP=acts.reduce(function(a,r){return a+(r.points||0);},0);
    var gp=me.target>0?Math.min(100,Math.round(totF/me.target*100)):0;
    var h='<div class="sg"><div class="sb"><div class="sl">My FYC</div><div class="sv g">'+fmtM(totF)+'</div></div>'
      +'<div class="sb"><div class="sl">Target</div><div class="sv">'+fmtM(me.target||0)+'</div></div>'
      +'<div class="sb"><div class="sl">Achieved</div><div class="sv">'+gp+'%</div></div></div>';
    h+='<div style="padding:0 12px 10px"><div class="bw" style="height:10px"><div class="bf" style="width:'+gp+'%"></div></div>'
      +'<div style="font-size:16px;color:#888;margin-top:3px">'+fmtM(totF)+' of '+fmtM(me.target||0)+'</div></div>';
    h+='<div class="sg"><div class="sb"><div class="sl">Pts</div><div class="sv">'+totP+'</div></div>'
      +'<div class="sb"><div class="sl">Sales</div><div class="sv">'+sales.length+'</div></div>'
      +'<div class="sb"><div class="sl">Acts</div><div class="sv">'+acts.length+'</div></div></div>';
    h+='<div class="sec-lbl">Sales</div><div class="card">';
    if(sales.length){sales.forEach(function(s){h+='<div class="ar"><div style="flex:1"><div class="at">'+esc(s.pdt)+' - '+esc(s.pdt_type)+'</div><div class="ad">'+fmtM(s.premium)+' - '+s.tenure+'yr - '+fmtD(s.sale_date)+'</div></div><span class="ap">'+fmtM(s.commission)+'</span></div>';});}
    else h+='<div class="emp">No sales.</div>';
    h+='</div><div class="sec-lbl">Activity Summary</div><div class="card">';
    if(acts.length){var bt={};acts.forEach(function(a){bt[a.activity_type]=(bt[a.activity_type]||0)+1;});Object.keys(bt).sort().forEach(function(t){h+='<div class="lr"><span class="ln">'+esc(t)+'</span><span class="lv">x'+bt[t]+'</span></div>';});}
    else h+='<div class="emp">No activities.</div>';
    h+='</div><div style="height:20px"></div>';
    document.getElementById("content").innerHTML=h;
  });
}

// ADMIN
function renderAdmin(){
  var h='<div style="padding:10px 12px 4px;font-size:17px;color:#aaa">Manage associates, rates and activities.</div>';
  h+='<div class="sec-lbl">Associates</div><div class="card" id="assoc-list"><div class="ld">Loading...</div></div>';
  h+='<div class="card" style="margin:6px 12px"><div class="card-head"><div class="card-title">Add Associate</div></div>';
  h+='<div class="fg"><div class="fl">Name</div><input class="fi" id="new-name" placeholder="Full name"/></div>';
  h+='<div class="fg"><div class="fl">Annual Target ($)</div><input type="number" class="fi" id="new-target" placeholder="50000"/></div>';
  h+='<div class="fg"><div class="fl">WhatsApp (with country code)</div><input class="fi" id="new-phone" placeholder="6591234567"/></div></div>';
  h+='<button class="btn" onclick="addAssoc()">+ Add Associate</button><div id="assoc-msg"></div>';
  h+='<div class="sec-lbl">Commission Rates (Year 1 %)</div><div class="card">';
  var rates=getRates();
  Object.keys(rates).sort().forEach(function(pdt){
    var r=rates[pdt];
    if(r.flat!==undefined){
      h+='<div class="adrow"><span style="font-size:17px;color:#aaa;min-width:120px">'+esc(pdt)+(r.gst?' (GST)':'')+'</span>'
        +'<input type="number" step="0.01" value="'+r.flat+'" data-pdt="'+esc(pdt)+'" data-type="flat" onchange="updRate(this)"/><span style="font-size:16px;color:#888">%</span></div>';
    }
  });
  h+='</div><button class="btn sec" onclick="addPdt()">+ Add Product/Rate</button>';
  h+='<button class="btn red" onclick="resetAll()">Reset to Defaults</button>';
  h+='<div id="admin-msg"></div><div style="height:30px"></div>';
  document.getElementById("content").innerHTML=h;
  loadAdminAssocs();
}

function loadAdminAssocs(){
  api("GET","associates","","order=name.asc&select=id,name,target,phone,active").then(function(rows){
    var el=document.getElementById("assoc-list");if(!el)return;
    if(!rows||!rows.length){el.innerHTML='<div class="emp">No associates.</div>';return;}
    var active=(rows||[]).filter(function(a){return a.active!==false;});
    var inactive=(rows||[]).filter(function(a){return a.active===false;});
    var h="";
    function row(a,isActive){
      return '<div class="adrow" style="flex-wrap:wrap;gap:6px;padding:10px 12px;'+(isActive?"":"opacity:0.5")+'">'
        +'<div style="flex:1;min-width:80px"><div style="font-size:15px;font-weight:500;color:'+(isActive?"#f0f0ee":"#666")+'">'+esc(a.name)+'</div><div style="font-size:16px;color:#999">'+esc(a.id)+'</div></div>'
        +(isActive
          ?'<div style="display:flex;flex-direction:column;gap:3px;min-width:130px">'
          +'<div style="display:flex;align-items:center;gap:4px"><span style="font-size:16px;color:#999;min-width:40px">Target</span>'
          +'<input type="number" value="'+(a.target||0)+'" data-aid="'+a.id+'" data-f="target" onchange="updAssoc(this)" style="flex:1;padding:4px;border-radius:5px;border:1px solid #252525;background:#111;color:#f0f0ee;font-size:17px;outline:none"/></div>'
          +'<div style="display:flex;align-items:center;gap:4px"><span style="font-size:16px;color:#999;min-width:40px">Phone</span>'
          +'<input value="'+esc(a.phone||"")+'" data-aid="'+a.id+'" data-f="phone" onchange="updAssoc(this)" placeholder="6591234567" style="flex:1;padding:4px;border-radius:5px;border:1px solid #252525;background:#111;color:#f0f0ee;font-size:17px;outline:none"/></div>'
          +'</div>'
          +'<button onclick="deactivateAssoc(\''+a.id+'\',\''+esc(a.name)+'\')" style="padding:4px 8px;border:1px solid #3a1a1a;border-radius:6px;background:transparent;color:#e74c3c;font-size:16px;cursor:pointer">Deactivate</button>'
          :'<button onclick="reactivateAssoc(\''+a.id+'\',\''+esc(a.name)+'\')" style="padding:4px 8px;border:1px solid #1a3a1a;border-radius:6px;background:transparent;color:#4caf50;font-size:16px;cursor:pointer">Reactivate</button>'
        )+'</div>';
    }
    active.forEach(function(a){h+=row(a,true);});
    if(inactive.length){h+='<div style="padding:6px 12px;font-size:15px;color:#888;text-transform:uppercase;border-top:1px solid #1a1a1a">Inactive</div>';inactive.forEach(function(a){h+=row(a,false);});}
    el.innerHTML=h;
  });
}

function updAssoc(el){
  var body={};body[el.dataset.f]=el.dataset.f==="target"?parseFloat(el.value)||0:el.value;
  patch("associates","id=eq."+el.dataset.aid,body).then(function(){showAdminMsg("Saved");});
}
function addAssoc(){
  var name=(document.getElementById("new-name").value||"").trim();
  var target=parseFloat(document.getElementById("new-target").value)||0;
  var phone=(document.getElementById("new-phone").value||"").trim();
  var msg=document.getElementById("assoc-msg");
  if(!name){msg.innerHTML='<div class="ms er">Enter a name.</div>';return;}
  api("GET","associates","","select=id&order=id.desc&limit=1").then(function(rows){
    var last=(rows&&rows[0]&&rows[0].id)||"ID000";
    var num=parseInt(last.replace("ID",""))+1;
    var nid="ID"+String(num).padStart(3,"0");
    api("POST","associates",{id:nid,name:name,target:target,phone:phone||null,active:true}).then(function(r){
      if(r&&r[0]&&r[0].id){
        msg.innerHTML='<div class="ms">'+esc(name)+' added as '+nid+'</div>';
        document.getElementById("new-name").value="";document.getElementById("new-target").value="";document.getElementById("new-phone").value="";
        loadAdminAssocs();setTimeout(function(){msg.innerHTML="";},2500);
      }else msg.innerHTML='<div class="ms er">Error. Try again.</div>';
    });
  });
}
function deactivateAssoc(id,name){
  if(!confirm("Deactivate "+name+"? Historical data preserved."))return;
  patch("associates","id=eq."+id,{active:false}).then(function(){loadAdminAssocs();showAdminMsg("Deactivated");});
}
function reactivateAssoc(id,name){
  patch("associates","id=eq."+id,{active:true}).then(function(){loadAdminAssocs();showAdminMsg("Reactivated");});
}
function updRateTable(el){
  var rates=getRates(),pdt=el.dataset.pdt;
  if(!rates[pdt])rates[pdt]={table:{}};
  if(!rates[pdt].table)rates[pdt].table={};
  rates[pdt].table[el.dataset.ten]=parseFloat(el.value)||0;
  localStorage.setItem("c5_rates",JSON.stringify(rates));
  showAdminMsg("Rate saved");
}
function updRate(el){
  var rates=getRates(),pdt=el.dataset.pdt;
  if(!rates[pdt])rates[pdt]={};
  rates[pdt].flat=parseFloat(el.value)||0;
  localStorage.setItem("c5_rates",JSON.stringify(rates));
  showAdminMsg("Rate saved");
}
function addPdt(){
  var pdt=prompt("Product code (e.g. NEWPDT):");if(!pdt)return;
  var rate=prompt("Year 1 rate %:");if(!rate)return;
  var gstAns=prompt("Has 9% GST in premium? yes/no:","no");
  var prods=getProds(),rates=getRates();
  rates[pdt.toUpperCase()]={flat:parseFloat(rate)||0,gst:(gstAns||"").toLowerCase()==="yes"};
  localStorage.setItem("c5_rates",JSON.stringify(rates));
  var cats=Object.keys(prods).join(", ");
  var cat=prompt("Add to category ("+cats+"):");
  if(cat&&prods[cat]){prods[cat].push(pdt.toUpperCase());localStorage.setItem("c5_prods",JSON.stringify(prods));}
  showAdminMsg(pdt.toUpperCase()+" added");renderAdmin();
}
function resetAll(){
  if(!confirm("Reset all custom changes?"))return;
  localStorage.removeItem("c5_acts");localStorage.removeItem("c5_prods");localStorage.removeItem("c5_rates");
  showAdminMsg("Reset done");renderAdmin();
}
function showAdminMsg(txt){
  var el=document.getElementById("admin-msg");
  if(el){el.innerHTML='<div class="ms">'+txt+'</div>';setTimeout(function(){if(el)el.innerHTML="";},1500);}
}

loadAssociates();
</script>
</body>
</html>

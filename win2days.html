<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Win2days"/>
<meta name="theme-color" content="#13120f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<title>Win2days</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fafaf8;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:#1a1a18;line-height:1.45}
body{overscroll-behavior:none}
input,textarea,button{font-family:inherit;-webkit-appearance:none;appearance:none}
#header{position:sticky;top:0;z-index:10;background:#fafaf8;border-bottom:1px solid #e4e2de}

/* Logo bar */
#logobar{background:#13120f;padding:10px 12px 9px;display:flex;align-items:center;justify-content:space-between}
#logo-lockup{display:flex;align-items:center;gap:8px}
#logo-icon{width:28px;height:28px;flex-shrink:0}
#logo-wordmark{display:flex;align-items:baseline;gap:0;line-height:1}
.lw-win{font-size:18px;font-weight:700;color:#fafaf8;letter-spacing:-0.03em}
.lw-two{font-size:18px;font-weight:800;color:#c9933a;letter-spacing:-0.03em}
.lw-days{font-size:18px;font-weight:300;color:#9a9896;letter-spacing:-0.02em}
#logo-tagline{font-size:10px;color:#4a4844;letter-spacing:0.08em;text-transform:uppercase;font-weight:500}

#datebar{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 8px}
#datetext{font-size:14px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:5px}
#saveddot{width:6px;height:6px;border-radius:50%;background:#4caf50;opacity:0;transition:opacity 0.4s;display:inline-block}
#tabs{display:flex;border-top:1px solid #e4e2de}
.tab{flex:1;padding:11px 0;border:none;background:transparent;font-size:11px;font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;color:#9a9896;border-bottom:2px solid transparent}
.tab.active{color:#1a1a18;border-bottom-color:#1a1a18}
#content{overflow-y:auto;-webkit-overflow-scrolling:touch;height:calc(100vh - 135px)}
.navbtn{width:32px;height:32px;border:1px solid #e4e2de;border-radius:8px;background:transparent;font-size:18px;cursor:pointer;color:#1a1a18;display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn{padding:0 9px;height:34px;border:1px solid #e4e2de;border-radius:8px;background:transparent;font-size:11px;font-weight:600;cursor:pointer;color:#1a1a18;white-space:nowrap}
.iconbtn.danger{color:#c0392b;border-color:#f5c6c2}
.btnrow{display:flex;gap:4px}

/* Schedule */
.halfbtns{display:flex;gap:6px;padding:10px 12px 0}
.halfbtn{flex:1;padding:9px 0;border-radius:8px;border:1px solid #e4e2de;background:transparent;color:#9a9896;font-size:12px;font-weight:500;cursor:pointer}
.halfbtn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.tagbar{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap;align-items:center;min-height:36px}
.tagpill{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tagpill .tpct{font-weight:400;opacity:0.65;font-size:10px}
.slotlist{margin-top:8px;border-top:1px solid #e4e2de}
.slotrow{border-bottom:1px solid #e4e2de}
.slotrow.anchor{background:#f0f0fa}
.slotmain{display:flex;align-items:center;min-height:46px}
.timecell{width:62px;min-width:62px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;border-right:1px solid #e4e2de;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9896;align-self:stretch}
.timecell.abold{font-weight:600;color:#7a7aaa}
.slotinput{flex:1;border:none;outline:none;padding:0 10px;font-size:14px;background:transparent;color:#1a1a18}
.slotinput.anc{font-weight:500;color:#4a4a8a}
.tagbadge{width:28px;height:28px;min-width:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:8px;font-size:10px;font-weight:700;user-select:none;flex-shrink:0}
.lockicon{width:30px;min-width:30px;margin-right:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aab}
.clientrow{display:flex;align-items:center;padding:0 8px 6px 72px;gap:5px}
.clientinput{flex:1;border:none;border-bottom:1px solid #e4e2de;outline:none;font-size:12px;color:#1d4ed8;background:transparent;padding:2px 4px}
.clientinput::placeholder{color:#93c5fd}

/* Summary */
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:10px 12px 0}
.statbox{background:#f2f1ee;border-radius:9px;padding:12px 6px;text-align:center}
.statlabel{font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.statval{font-size:28px;font-weight:600}
.seclabel{padding:11px 12px 0;font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em}
.sumcol{margin:5px 12px 10px;border:1px solid #e4e2de;border-radius:10px;overflow:hidden}
.sumhead{padding:9px 12px;background:#f2f1ee;border-bottom:1px solid #e4e2de}
.sumlabel{font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:1px}
.sumtitle{font-size:13px;font-weight:500}
.pulledrow{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid #e4e2de}
.ptag{width:3px;min-width:3px;height:22px;border-radius:2px;background:#e4e2de}
.ptag.client{background:#93c5fd}.ptag.admin{background:#fcd34d}.ptag.personal{background:#6ee7b7}.ptag.agency{background:#c4b5fd}.ptag.recruit{background:#fda4af}
.ptime{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9a9896;min-width:48px}
.pinfo{flex:1;display:flex;flex-direction:column;gap:2px}
.ptext{font-size:13px;color:#1a1a18}
.ptext.done{text-decoration:line-through;opacity:0.4}
.pclient{font-size:11px;color:#1d4ed8;font-weight:500}
.pcheck{width:19px;height:19px;min-width:19px;border-radius:4px;border:1.5px solid #ccc;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcheck.checked{background:#1a1a18;border-color:#1a1a18}
.itemrow{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid #e4e2de}
.checkbox{width:19px;height:19px;min-width:19px;border-radius:4px;border:1.5px solid #ccc;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.checkbox.checked{background:#1a1a18;border-color:#1a1a18}
.iteminput{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:#1a1a18}
.iteminput.done{text-decoration:line-through;opacity:0.4}
.delbtn{width:22px;height:22px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.delbtn:hover{color:#c0392b}
.cfarrow{font-size:11px;color:transparent;padding:2px 6px;border-radius:5px;user-select:none;white-space:nowrap;font-weight:500;min-width:44px;text-align:center}
.cfarrow.active{color:#1a1a18;cursor:pointer;background:#f2f1ee;border:1px solid #e4e2de}
.cfarrow.sent{color:#4caf50;font-size:10px}
.addbtn{width:100%;padding:10px 12px;text-align:left;border:none;background:transparent;font-size:12px;color:#9a9896;cursor:pointer;border-top:1px solid #e4e2de}
.notesbox{margin:0 12px 16px;border:1px solid #e4e2de;border-radius:10px;overflow:hidden}
.noteshead{padding:9px 12px;background:#f2f1ee;border-bottom:1px solid #e4e2de;font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em}
textarea{width:100%;min-height:90px;border:none;outline:none;padding:12px;font-size:14px;color:#1a1a18;background:transparent;resize:none;line-height:1.8}

/* Data & Settings */
.settingsbox{margin:10px 12px;border:1px solid #e4e2de;border-radius:10px;overflow:hidden}
.settingshead{padding:9px 12px;background:#f2f1ee;border-bottom:1px solid #e4e2de;font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em}
.settings-row{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #e4e2de}
.settings-row:last-child{border-bottom:none}
.settings-info{flex:1}
.settings-title{font-size:14px;font-weight:500;margin-bottom:3px}
.settings-desc{font-size:12px;color:#9a9896;line-height:1.5}
.settings-btn{padding:8px 14px;border:1px solid #e4e2de;border-radius:8px;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:#1a1a18;white-space:nowrap}
.settings-btn.green{color:#065f46;border-color:#6ee7b7;background:#d1fae5}
.settings-btn.red{color:#c0392b;border-color:#f5c6c2}
.notif-status{font-size:11px;margin-top:4px}

/* Weekly */
.week-wrap{padding:10px 12px 40px}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-title{font-size:14px;font-weight:600}
.week-table{width:100%;border-collapse:collapse;margin-bottom:14px}
.week-table th{font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.06em;padding:6px 3px;text-align:left;border-bottom:1px solid #e4e2de}
.week-table td{padding:6px 3px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
.week-table tr.today-row td{background:#f8f8f4}
.day-label{font-size:12px;font-weight:500;color:#1a1a18;min-width:36px}
.day-label.muted{color:#9a9896;font-weight:400}
.day-bar-wrap{display:flex;gap:1px;height:15px;border-radius:3px;overflow:hidden;flex:1;background:#f2f1ee;min-width:80px}
.day-bar-seg{height:100%}
.day-total{font-size:11px;color:#9a9896;min-width:24px;text-align:right}
.week-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555}
.leg-dot{width:8px;height:8px;border-radius:2px}
.week-totals{border:1px solid #e4e2de;border-radius:10px;overflow:hidden;margin-bottom:12px}
.week-totals-head{padding:9px 12px;background:#f2f1ee;font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid #e4e2de}
.wt-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f0f0ee}
.wt-row:last-child{border-bottom:none}
.wt-color{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.wt-label{font-size:13px;flex:1}
.wt-val{font-size:13px;font-weight:600}
.wt-pct{font-size:11px;color:#9a9896;min-width:32px;text-align:right}
.client-log{border:1px solid #e4e2de;border-radius:10px;overflow:hidden}
.client-log-head{padding:9px 12px;background:#f2f1ee;font-size:10px;color:#9a9896;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid #e4e2de}
.cl-row{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #f0f0ee}
.cl-row:last-child{border-bottom:none}
.cl-date{font-size:11px;color:#9a9896;min-width:56px}
.cl-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#bbb;min-width:44px}
.cl-name{font-size:13px;color:#1d4ed8;font-weight:500;flex:1}
.cl-task{font-size:11px;color:#555}

#print-view{display:none}
</style>
</head>
<body>
<div id="header">
  <div id="logobar">
    <div id="logo-lockup">
      <svg id="logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="8" fill="#c9933a"/>
        <path d="M6 8.5L9.5 19L14 12L18.5 19L22 8.5" stroke="#13120f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14" cy="21.5" r="1.4" fill="#13120f"/>
      </svg>
      <div id="logo-wordmark">
        <span class="lw-win">Win</span><span class="lw-two">2</span><span class="lw-days">days</span>
      </div>
    </div>
    <span id="logo-tagline">Your day. Your win.</span>
  </div>
  <div id="datebar">
    <button class="navbtn" onclick="changeDate(-1)">&#8249;</button>
    <div id="datetext"><span id="datelabel"></span><span id="saveddot"></span></div>
    <div class="btnrow">
      <button class="iconbtn" onclick="copyYesterday()">↩ Yday</button>
      <button class="iconbtn" onclick="exportPDF()">PDF</button>
      <button class="iconbtn danger" onclick="clearDay()">Clear</button>
      <button class="navbtn" onclick="changeDate(1)">&#8250;</button>
    </div>
  </div>
  <div id="tabs">
    <button class="tab active" onclick="switchTab('schedule')">Schedule</button>
    <button class="tab" onclick="switchTab('summary')">Summary</button>
    <button class="tab" onclick="switchTab('week')">Week</button>
    <button class="tab" onclick="switchTab('settings')">Data</button>
  </div>
</div>
<div id="app-view"><div id="content"></div></div>
<div id="print-view"></div>

<script>
var D1=[
  {t:"7:30am",label:"7:30 am",a:"Wake up",anchor:true},
  {t:"8:00am",label:"8:00 am"},
  {t:"8:30am",label:"8:30 am",a:"Leave home",anchor:true},
  {t:"9:00am",label:"9:00 am"},
  {t:"9:30am",label:"9:30 am",a:"Reach office",anchor:true},
  {t:"10:00am",label:"10:00 am"},{t:"10:30am",label:"10:30 am"},
  {t:"11:00am",label:"11:00 am"},{t:"11:30am",label:"11:30 am"},
  {t:"12:00pm",label:"12:00 pm"},{t:"12:30pm",label:"12:30 pm"},
  {t:"1:00pm",label:"1:00 pm"},{t:"1:30pm",label:"1:30 pm"},
  {t:"2:00pm",label:"2:00 pm"},{t:"2:30pm",label:"2:30 pm"}
];
var D2=[
  {t:"3:00pm",label:"3:00 pm"},{t:"3:30pm",label:"3:30 pm"},
  {t:"4:00pm",label:"4:00 pm"},{t:"4:30pm",label:"4:30 pm"},
  {t:"5:00pm",label:"5:00 pm"},{t:"5:30pm",label:"5:30 pm"},
  {t:"6:00pm",label:"6:00 pm"},{t:"6:30pm",label:"6:30 pm"},
  {t:"7:00pm",label:"7:00 pm"},{t:"7:30pm",label:"7:30 pm"},
  {t:"8:00pm",label:"8:00 pm"},{t:"8:30pm",label:"8:30 pm"},
  {t:"9:00pm",label:"9:00 pm"},{t:"9:30pm",label:"9:30 pm"},
  {t:"10:00pm",label:"10:00 pm"},{t:"10:30pm",label:"10:30 pm"},
  {t:"11:00pm",label:"11:00 pm"},{t:"11:30pm",label:"11:30 pm"},
  {t:"12:00am",label:"12:00 am"}
];
var ALL=D1.concat(D2);
var ANCHORS={};D1.forEach(function(s){if(s.anchor)ANCHORS[s.t]=s.a;});

var TAGS=[
  {key:"",abbr:"",bg:"transparent",color:"#ccc",border:"1.5px dashed #d8d5d0"},
  {key:"client",abbr:"C",bg:"#dbeafe",color:"#1d4ed8",border:"none"},
  {key:"admin",abbr:"A",bg:"#fef3c7",color:"#92400e",border:"none"},
  {key:"personal",abbr:"P",bg:"#d1fae5",color:"#065f46",border:"none"},
  {key:"agency",abbr:"AG",bg:"#ede9fe",color:"#5b21b6",border:"none"},
  {key:"recruit",abbr:"R",bg:"#ffe4e6",color:"#9f1239",border:"none"}
];
var TM={
  client:{bg:"#dbeafe",color:"#1d4ed8",label:"Client",bar:"#93c5fd"},
  admin:{bg:"#fef3c7",color:"#92400e",label:"Admin",bar:"#fcd34d"},
  personal:{bg:"#d1fae5",color:"#065f46",label:"Personal",bar:"#6ee7b7"},
  agency:{bg:"#ede9fe",color:"#5b21b6",label:"Agency",bar:"#c4b5fd"},
  recruit:{bg:"#ffe4e6",color:"#9f1239",label:"Recruit",bar:"#fda4af"}
};
var TAG_ORDER=["client","admin","agency","recruit","personal"];

var curDate=todayStr(),curTab="schedule",curHalf=1;
var saveTimer=null,cfed={},navLock=false,state={};
var weekOffset=0;

// Persistent (rolling) tasks — stored globally, not per day
function getPersistent(){
  var raw=localStorage.getItem("planner:persistent");
  return raw?JSON.parse(raw):[];
}
function savePersistent(arr){
  localStorage.setItem("planner:persistent",JSON.stringify(arr));
}

function pad(n){return n<10?"0"+n:""+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(d,n){var p=d.split("-");var dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()+n);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}
function fmtDate(d){var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function fmtShort(d){var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"});}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function chk(){return'<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3L3.5 5.5L8 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function getMondayOf(d){var p=d.split("-");var dt=new Date(+p[0],+p[1]-1,+p[2]);var day=dt.getDay();var diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}

function initState(){
  var s={};ALL.forEach(function(x){s[x.t]=x.a||"";});
  return{slots:s,tags:{},checks:{},clientnames:{},persistChecks:{},notes:""};
}
function loadDate(d){
  cfed={};
  var raw=localStorage.getItem("planner:"+d);
  state=raw?JSON.parse(raw):initState();
  if(!state.slots){var s={};ALL.forEach(function(x){s[x.t]=x.a||"";});state.slots=s;}
  if(!state.tags)state.tags={};
  if(!state.checks)state.checks={};
  if(!state.clientnames)state.clientnames={};
  if(!state.persistChecks)state.persistChecks={};
  if(!state.slotCf)state.slotCf={};
  if(!state.notes)state.notes="";
  // Remove d1items/d2items — now handled by persistent tasks globally
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    localStorage.setItem("planner:"+curDate,JSON.stringify(state));
    var dot=document.getElementById("saveddot");
    if(dot){dot.style.opacity=1;setTimeout(function(){dot.style.opacity=0;},1200);}
  },300);
}

function changeDate(n){
  if(navLock)return;navLock=true;setTimeout(function(){navLock=false;},600);
  curDate=addDays(curDate,n);loadDate(curDate);
  document.getElementById("datelabel").textContent=fmtDate(curDate);
  render();
}
function switchTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(el){el.classList.toggle("active",el.textContent.toLowerCase()===t);});
  render();
}
function clearDay(){
  if(!confirm("Clear all data for "+fmtDate(curDate)+"?"))return;
  state=initState();persist();render();
}
function copyYesterday(){
  var yd=addDays(curDate,-1);
  var raw=localStorage.getItem("planner:"+yd);
  if(!raw){alert("No data found for yesterday.");return;}
  var ys=JSON.parse(raw);
  if(!confirm("Copy yesterday's schedule and tags to today? Slots will be overwritten."))return;
  var newSlots=Object.assign({},ys.slots||{});
  // Always reset anchor slots to defaults
  Object.keys(ANCHORS).forEach(function(k){newSlots[k]=ANCHORS[k];});
  state.slots=newSlots;
  state.tags=Object.assign({},ys.tags||{});
  state.clientnames=Object.assign({},ys.clientnames||{});
  state.checks={};
  state.persistChecks={};
  persist();render();
}

function getTag(t){return TAGS.filter(function(x){return x.key===(state.tags[t]||"");})[0]||TAGS[0];}
function tagCounts(st){
  st=st||state;
  var c={};
  ALL.forEach(function(s){var t=(st.tags||{})[s.t];if(t)c[t]=(c[t]||0)+1;});
  return c;
}
function pulled(){
  return ALL.filter(function(s){return !s.anchor&&(state.slots[s.t]||"").trim()&&state.tags[s.t];});
}

function tagBarHTML(tc){
  var total=Object.values(tc).reduce(function(a,b){return a+b;},0);
  var html='<div class="tagbar">';
  var any=false;
  TAG_ORDER.forEach(function(k){
    if(!tc[k]||!TM[k])return;any=true;
    var m=TM[k],pct=total?Math.round(tc[k]/total*100):0;
    html+='<span class="tagpill" style="background:'+m.bg+';color:'+m.color+'">'+m.label+' '+tc[k]+' <span class="tpct">'+pct+'%</span></span>';
  });
  if(!any)html+='<span style="font-size:11px;color:#9a9896">Tap box beside each slot to tag it</span>';
  return html+'</div>';
}

// ── SCHEDULE ─────────────────────────────────────────────────────────────────
function renderSchedule(){
  var slots=curHalf===1?D1:D2;
  var tc=tagCounts();
  var html='<div class="halfbtns">'
    +'<button class="halfbtn'+(curHalf===1?" active":"")+'" onclick="setHalf(1)">Day 1 · 7:30am – 2:30pm</button>'
    +'<button class="halfbtn'+(curHalf===2?" active":"")+'" onclick="setHalf(2)">Day 2 · 3:00pm – 12:00am</button>'
    +'</div>'+tagBarHTML(tc)+'<div class="slotlist">';
  slots.forEach(function(row){
    var t=row.t,val=state.slots[t]||"",tag=getTag(t);
    var isClient=state.tags[t]==="client";
    var cname=state.clientnames[t]||"";
    if(row.anchor){
      html+='<div class="slotrow anchor"><div class="slotmain">'
        +'<div class="timecell abold">'+row.label+'</div>'
        +'<input class="slotinput anc" data-t="'+t+'" value="'+esc(val)+'" oninput="updSlot(this)"/>'
        +'<div class="lockicon">🔒</div></div></div>';
    } else {
      html+='<div class="slotrow"><div class="slotmain">'
        +'<div class="timecell">'+row.label+'</div>'
        +'<input class="slotinput" data-t="'+t+'" value="'+esc(val)+'" placeholder="—" oninput="updSlot(this)"/>'
        +'<div class="tagbadge" onclick="cycleTag(\''+t+'\')" style="background:'+tag.bg+';color:'+tag.color+';border:'+tag.border+'">'+tag.abbr+'</div>'
        +'</div>';
      if(isClient){
        html+='<div class="clientrow">'
          +'<span style="font-size:11px;color:#93c5fd;min-width:28px">client</span>'
          +'<input class="clientinput" data-t="'+t+'" value="'+esc(cname)+'" placeholder="Enter client name…" oninput="updClient(this)"/>'
          +'</div>';

    }

}
function setHalf(h){curHalf=h;renderSchedule();}
function updSlot(el){state.slots[el.dataset.t]=el.value;persist();}
function updClient(el){state.clientnames[el.dataset.t]=el.value;persist();}
function cycleTag(t){
  var keys=TAGS.map(function(x){return x.key;});
  state.tags[t]=keys[(keys.indexOf(state.tags[t]||"")+1)%keys.length];
  if(state.tags[t]!=="client")delete state.clientnames[t];
  persist();renderSchedule();
}

// ── SUMMARY ──────────────────────────────────────────────────────────────────
function renderSummary(){
  var pl=pulled();
  var tc=tagCounts();
  var tagTotal=Object.values(tc).reduce(function(a,b){return a+b;},0);
  var persistent=getPersistent();
  var plDone=pl.filter(function(s){return state.checks[s.t];}).length;
  var pDone=persistent.filter(function(it,i){return state.persistChecks[i];}).length;
  var totalDone=plDone+pDone;
  var totalTasks=pl.length+persistent.length;

  var html='<div class="statgrid">'
    +'<div class="statbox"><div class="statlabel">Done</div><div class="statval">'+totalDone+'</div></div>'
    +'<div class="statbox"><div class="statlabel">Total</div><div class="statval">'+totalTasks+'</div></div>'
    +'<div class="statbox"><div class="statlabel">Rate</div><div class="statval">'+(totalTasks?Math.round(totalDone/totalTasks*100):0)+'%</div></div>'
    +'</div>';

  var thtml='<div class="tagbar">';var anyTag=false;
  TAG_ORDER.forEach(function(k){
    if(!tc[k]||!TM[k])return;anyTag=true;
    var m=TM[k],pct=tagTotal?Math.round(tc[k]/tagTotal*100):0;
    thtml+='<span class="tagpill" style="background:'+m.bg+';color:'+m.color+'">'+m.label+' '+tc[k]+' <span class="tpct">'+pct+'%</span></span>';
  });
  if(!anyTag)thtml+='<span style="font-size:11px;color:#9a9896">Tag schedule slots to see breakdown</span>';
  html+=thtml+'</div>';

  // From schedule
  if(pl.length){
    html+='<div class="seclabel">From schedule</div><div class="sumcol">';
    pl.forEach(function(s){
      var done=!!state.checks[s.t],tagKey=state.tags[s.t]||"",cname=state.clientnames[s.t]||"";
      var isCfed=!!state.slotCf[s.t], canCf=!done&&!isCfed;
      html+='<div class="pulledrow">'
        +'<div class="ptag'+(tagKey?" "+tagKey:"")+'"></div>'
        +'<span class="ptime">'+s.label+'</span>'
        +'<div class="pinfo"><span class="ptext'+(done?" done":"")+'">'+esc(state.slots[s.t])+'</span>'
        +(cname?'<span class="pclient">'+esc(cname)+'</span>':"")+'</div>'
        +'<div class="cfarrow'+(isCfed?" sent":canCf?" active":"")+'" onclick="carrySlot(\''+s.t+'\')">'+( isCfed?"✓ sent":canCf?"→ tmr":"")+'</div>'
        +'<div class="pcheck'+(done?" checked":"")+'" onclick="toggleCheck(\''+s.t+'\')">'+(done?chk():"")+'</div>'
        +'</div>';
    });
    html+='</div>';
  }

  // Persistent (rolling) tasks
  html+='<div class="seclabel">Ongoing tasks <span style="font-weight:400;color:#bbb">(rolls over daily)</span></div>';
  html+='<div class="sumcol">';
  if(persistent.length){
    persistent.forEach(function(it,i){
      var done=!!state.persistChecks[i];
      html+='<div class="itemrow">'
        +'<div class="checkbox'+(done?" checked":"")+'" onclick="togglePersist('+i+')">'+(done?chk():"")+'</div>'
        +'<input class="iteminput'+(done?" done":"")+'" data-pi="'+i+'" value="'+esc(it.text)+'" placeholder="add ongoing task…" oninput="updPersist(this)"/>'
        +'<button class="delbtn" onclick="delPersist('+i+')" title="Remove permanently">×</button>'
        +'</div>';
    });
  }
  html+='<button class="addbtn" onclick="addPersist()">+ add ongoing task</button></div>';

  html+='<div class="notesbox"><div class="noteshead">Notes / Carry-forward</div>'
    +'<textarea oninput="updNotes(this)" placeholder="Reflections, blockers, carry-forwards…">'+esc(state.notes)+'</textarea></div>';

  // Carry-forward from yesterday's notes prompt
  html+='<div style="height:40px"></div>';
  document.getElementById("content").innerHTML=html;
}

function toggleCheck(t){state.checks[t]=!state.checks[t];persist();renderSummary();}
function carrySlot(t){
  if(state.checks[t]||state.slotCf[t])return;
  var task=state.slots[t]||"";
  var cname=state.clientnames[t]||"";
  var label=task+(cname?" ("+cname+")":"");
  if(!label.trim())return;
  var nd=addDays(curDate,1);
  var raw=localStorage.getItem("planner:"+nd);
  var td=raw?JSON.parse(raw):initState();
  if(!td.d1items)td.d1items=[];
  // Find first empty slot in tomorrow's schedule
  var placed=false;
  var tkeys=Object.keys(td.slots||{});
  for(var i=0;i<ALL.length;i++){
    var s=ALL[i];
    if(s.anchor)continue;
    var v=(td.slots||{})[s.t]||"";
    if(!v.trim()){
      if(!td.slots)td.slots={};
      td.slots[s.t]="↳ "+label;
      if(cname){if(!td.clientnames)td.clientnames={};td.clientnames[s.t]=cname;}
      if(state.tags[t]){if(!td.tags)td.tags={};td.tags[s.t]=state.tags[t];}
      placed=true;break;
    }
  }
  // If no empty slot found, add to persistent tasks
  if(!placed){
    var raw2=localStorage.getItem("planner:persistent");
    var pa=raw2?JSON.parse(raw2):[];
    pa.push({text:"↳ "+label});
    localStorage.setItem("planner:persistent",JSON.stringify(pa));
  }
  localStorage.setItem("planner:"+nd,JSON.stringify(td));
  state.slotCf[t]=true;
  persist();renderSummary();
}
function togglePersist(i){
  state.persistChecks[i]=!state.persistChecks[i];
  persist();renderSummary();
}
function updPersist(el){
  var arr=getPersistent();
  arr[+el.dataset.pi].text=el.value;
  savePersistent(arr);
}
function addPersist(){
  var arr=getPersistent();
  arr.push({text:""});
  savePersistent(arr);
  renderSummary();
  setTimeout(function(){var inp=document.querySelectorAll('[data-pi]');if(inp.length)inp[inp.length-1].focus();},50);
}
function delPersist(i){
  var arr=getPersistent();
  arr.splice(i,1);
  savePersistent(arr);
  // Rebuild persistChecks
  var nc={};
  Object.keys(state.persistChecks).forEach(function(k){
    var ki=+k;
    if(ki<i)nc[ki]=state.persistChecks[k];
    else if(ki>i)nc[ki-1]=state.persistChecks[k];
  });
  state.persistChecks=nc;
  persist();renderSummary();
}
function updNotes(el){state.notes=el.value;persist();}

// ── WEEKLY ────────────────────────────────────────────────────────────────────
function renderWeek(){
  var monday=getMondayOf(addDays(todayStr(),weekOffset*7));
  var days=[];for(var i=0;i<7;i++)days.push(addDays(monday,i));
  var dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var today2=todayStr();
  var weekTotals={};var clientLog=[];

  var html='<div class="week-wrap"><div class="week-nav">'
    +'<button class="navbtn" onclick="changeWeek(-1)">&#8249;</button>'
    +'<div class="week-title">'+fmtShort(monday)+' — '+fmtShort(days[6])+'</div>'
    +'<button class="navbtn" onclick="changeWeek(1)">&#8250;</button>'
    +'</div>';

  html+='<div class="week-legend">';
  TAG_ORDER.forEach(function(k){if(!TM[k])return;html+='<div class="leg-item"><div class="leg-dot" style="background:'+TM[k].bar+'"></div>'+TM[k].label+'</div>';});
  html+='</div>';

  html+='<table class="week-table"><thead><tr><th>Day</th><th>Distribution</th><th>#</th></tr></thead><tbody>';
  days.forEach(function(d,idx){
    var raw=localStorage.getItem("planner:"+d);
    var ds=raw?JSON.parse(raw):null;
    var tc=ds?tagCounts(ds):{};
    var total=Object.values(tc).reduce(function(a,b){return a+b;},0);
    var isToday=d===today2;
    TAG_ORDER.forEach(function(k){weekTotals[k]=(weekTotals[k]||0)+(tc[k]||0);});
    if(ds&&ds.tags&&ds.clientnames){
      ALL.forEach(function(s){
        if(ds.tags[s.t]==="client"&&ds.clientnames[s.t])
          clientLog.push({date:d,label:s.label,client:ds.clientnames[s.t],task:(ds.slots||{})[s.t]||""});
      });
    }
    html+='<tr'+(isToday?' class="today-row"':'')+'>'
      +'<td><div class="day-label'+(isToday?"":" muted")+'">'+dayNames[idx]+'<br><span style="font-size:8px;color:#ccc">'+d.slice(5)+'</span></div></td>'
      +'<td><div class="day-bar-wrap">';
    if(total){TAG_ORDER.forEach(function(k){if(!tc[k])return;html+='<div class="day-bar-seg" style="width:'+Math.round(tc[k]/total*100)+'%;background:'+TM[k].bar+'"></div>';});}
    html+='</div></td><td><div class="day-total">'+total+'</div></td></tr>';
  });
  html+='</tbody></table>';

  var grandTotal=Object.values(weekTotals).reduce(function(a,b){return a+b;},0);
  html+='<div class="week-totals"><div class="week-totals-head">Weekly breakdown — '+grandTotal+' tagged slots total</div>';
  TAG_ORDER.forEach(function(k){
    if(!weekTotals[k]||!TM[k])return;
    var pct=grandTotal?Math.round(weekTotals[k]/grandTotal*100):0;
    html+='<div class="wt-row"><div class="wt-color" style="background:'+TM[k].bar+'"></div>'
      +'<div class="wt-label">'+TM[k].label+'</div>'
      +'<div class="wt-val">'+weekTotals[k]+'</div>'
      +'<div class="wt-pct">'+pct+'%</div></div>';
  });
  if(!grandTotal)html+='<div style="padding:10px;font-size:12px;color:#9a9896">No tagged slots this week yet.</div>';
  html+='</div>';

  if(clientLog.length){
    html+='<div style="margin-top:12px"><div class="client-log"><div class="client-log-head">Client activity this week</div>';
    clientLog.forEach(function(cl){
      html+='<div class="cl-row"><span class="cl-date">'+fmtShort(cl.date)+'</span><span class="cl-time">'+cl.label+'</span><span class="cl-name">'+esc(cl.client)+'</span><span class="cl-task">'+esc(cl.task)+'</span></div>';
    });
    html+='</div></div>';
  }
  html+='</div>';
  document.getElementById("content").innerHTML=html;
}
function changeWeek(n){weekOffset+=n;renderWeek();}

function renderSettings(){
  var notifSupported="Notification" in window;
  var notifPerm=notifSupported?Notification.permission:"unsupported";
  var dataCount=0;
  for(var k in localStorage){if(k.indexOf("planner:")===0)dataCount++;}

  var html='<div style="padding:12px 0 40px">';

  // Backup & Restore
  html+='<div class="settingsbox"><div class="settingshead">Backup &amp; Restore</div>';
  html+='<div class="settings-row">'
    +'<div class="settings-info"><div class="settings-title">Export all data</div>'
    +'<div class="settings-desc">Download a JSON backup of all '+dataCount+' days. Save this file somewhere safe — email it to yourself or put it in Google Drive.</div></div>'
    +'<button class="settings-btn green" onclick="exportData()">Export</button>'
    +'</div>';
  html+='<div class="settings-row">'
    +'<div class="settings-info"><div class="settings-title">Restore from backup</div>'
    +'<div class="settings-desc">Import a previously exported JSON file. Existing data will be merged.</div></div>'
    +'<button class="settings-btn" onclick="document.getElementById(\'importfile\').click()">Import</button>'
    +'</div>'
    +'<input type="file" id="importfile" accept=".json" style="display:none" onchange="importData(this)"/>';
  html+='</div>';

  // Notifications
  html+='<div class="settingsbox" style="margin-top:12px"><div class="settingshead">9pm Reminder</div>';
  html+='<div class="settings-row">'
    +'<div class="settings-info"><div class="settings-title">End-of-day notification</div>'
    +'<div class="settings-desc">'
    +(notifSupported
      ? 'Get a reminder at 9pm to fill in your summary. Status: <strong>'+notifPerm+'</strong>.<br>Note: requires this file to be open in the browser.'
      :'Notifications not supported on this browser/device (iOS Safari limitation).')
    +'</div></div>'
    +(notifSupported&&notifPerm!=="granted"
      ?'<button class="settings-btn" onclick="requestNotif()">Enable</button>'
      :(notifPerm==="granted"?'<span style="font-size:11px;color:#065f46;font-weight:600">✓ On</span>':''))
    +'</div></div>';

  // Danger zone
  html+='<div class="settingsbox" style="margin-top:12px"><div class="settingshead">Danger zone</div>';
  html+='<div class="settings-row">'
    +'<div class="settings-info"><div class="settings-title">Clear all data</div>'
    +'<div class="settings-desc">Permanently delete all planner data from this device. Export first.</div></div>'
    +'<button class="settings-btn red" onclick="nukeAll()">Delete all</button>'
    +'</div></div>';

  html+='</div>';
  document.getElementById("content").innerHTML=html;
}

function exportData(){
  var out={};
  for(var k in localStorage){
    if(k.indexOf("planner:")===0)out[k]=localStorage.getItem(k);
  }
  var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="planner-backup-"+todayStr()+".json";
  a.click();URL.revokeObjectURL(a.href);
}

function importData(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var count=0;
      Object.keys(data).forEach(function(k){
        if(k.indexOf("planner:")===0){localStorage.setItem(k,data[k]);count++;}
      });
      alert("Restored "+count+" entries. Reload to see changes.");
      loadDate(curDate);render();
    }catch(err){alert("Invalid backup file.");}
  };
  reader.readAsText(file);
  input.value="";
}

function nukeAll(){
  if(!confirm("Delete ALL planner data permanently? This cannot be undone."))return;
  if(!confirm("Are you absolutely sure?"))return;
  var keys=[];
  for(var k in localStorage){if(k.indexOf("planner:")===0)keys.push(k);}
  keys.forEach(function(k){localStorage.removeItem(k);});
  state=initState();
  alert("All data deleted.");
  render();
}

function requestNotif(){
  if(!("Notification" in window))return;
  Notification.requestPermission().then(function(p){
    if(p==="granted"){scheduleNotif();renderSettings();}
    else{alert("Permission denied. Enable notifications in your browser settings.");}
  });
}

var notifTimer=null;
function scheduleNotif(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  clearTimeout(notifTimer);
  var now=new Date();
  var ninepm=new Date(now.getFullYear(),now.getMonth(),now.getDate(),21,0,0);
  if(now>=ninepm)ninepm.setDate(ninepm.getDate()+1);
  var ms=ninepm-now;
  notifTimer=setTimeout(function(){
    new Notification("Win2days",{body:"Time to wrap up — fill in today's summary!",icon:""});
    scheduleNotif();
  },ms);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

// Schedule notification if already granted
if("Notification" in window && Notification.permission==="granted") scheduleNotif();

loadDate(curDate);
document.getElementById("datelabel").textContent=fmtDate(curDate);
render();
</script>
